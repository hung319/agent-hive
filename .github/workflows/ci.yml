name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Put bun on PATH
        run: echo "$(dirname "$(command -v bun)")" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install

      - name: Build hive-core
        working-directory: packages/hive-core
        run: bun run build

      - name: Reinstall to link workspace packages
        run: bun install

      - name: Test hive-core
        working-directory: packages/hive-core
        run: bun test

      # Bisect: which group turns the suite red on the runner?
      - name: G1 utils
        working-directory: packages/opencode-hive
        run: bun test ./src/utils

      - name: G1b services
        working-directory: packages/opencode-hive
        run: bun test ./src/services

      - name: G1c tools
        working-directory: packages/opencode-hive
        run: bun test ./src/tools

      - name: G1d mcp+templates
        working-directory: packages/opencode-hive
        run: bun test ./src/mcp ./src/templates

      - name: G2 hooks+skills+harness
        working-directory: packages/opencode-hive
        run: bun test ./src/hooks ./src/skills ./src/__tests__

      - name: G3 e2e identity
        working-directory: packages/opencode-hive
        run: |
          set -x
          git config user.name; echo "rc1=$?"
          git status --short; echo "rc2=$?"
          ls -la .git 2>&1; echo "rc3=$?"
          ls -la ../../.git 2>&1 | head -5; echo "rc4=$?"
          git -C ../.. config user.name; echo "rc5=$?"
          true

      - name: G4 agents
        working-directory: packages/opencode-hive
        run: bun test ./src/agents
