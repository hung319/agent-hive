name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Put bun on PATH
        run: echo "$(dirname "$(command -v bun)")" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install

      - name: Build hive-core
        working-directory: packages/hive-core
        run: bun run build

      - name: Reinstall to link workspace packages
        run: bun install

      - name: Test hive-core
        working-directory: packages/hive-core
        run: bun test

      - name: Probe node node
        run: |
          ls -la node 2>&1 | head -2
          node -e 'console.log(1)' 2>&1 | head -3
          echo "rc=$?"

      # Plugin setup no longer installs packages, so no network is needed here.
      - name: Test opencode-hive
        working-directory: packages/opencode-hive
        run: bun test --timeout 30000

      - name: Build opencode-hive
        working-directory: packages/opencode-hive
        run: bun run build
