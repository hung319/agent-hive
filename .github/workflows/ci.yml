name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # setup-bun only puts its binary on PATH for the action's own step; the
      # later steps spawn `bun` as a subprocess (`bun install`, build scripts,
      # `bun test`).
      - name: Put bun on PATH for the test run
        run: echo "$(dirname "$(command -v bun)")" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install

      - name: Build hive-core
        working-directory: packages/hive-core
        run: bun run build

      - name: Reinstall to link workspace packages
        run: bun install

      - name: Test hive-core
        working-directory: packages/hive-core
        run: bun test

      # Fresh temp dir per step: several suites chdir into their own sandbox
      # (e.g. /tmp/hive-e2e-plugin-*), and `set -e` would otherwise abort the
      # whole script on the first failing `cd`.
      - name: Test opencode-hive
        working-directory: packages/opencode-hive
        run: |
          set -u
          logdir=$(mktemp -d "/tmp/hive-ci-XXXXXX")
          cd /tmp
          cd "$GITHUB_WORKSPACE/packages/opencode-hive" || exit 1
          set +e
          bun test 2>&1 | tee "$logdir/opencode-hive.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "::notice::bun test exit code: $rc"
          tail -40 "$logdir/opencode-hive.log"
          exit $rc

      - name: Build opencode-hive
        working-directory: packages/opencode-hive
        run: bun run build
