name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # setup-bun only puts its binary on PATH for the action's own step, while
      # `bun install`, the build scripts and `bun test` spawn `bun` themselves.
      - name: Put bun on PATH
        run: echo "$(dirname "$(command -v bun)")" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install

      - name: Build hive-core
        working-directory: packages/hive-core
        run: bun run build

      - name: Reinstall to link workspace packages
        run: bun install

      - name: Test hive-core
        working-directory: packages/hive-core
        run: bun test

      # Listed file by file (order matters: this resolution breaks when one of
      # these runs after other test files in the same process).
      - name: Test opencode-hive (agent files)
        working-directory: packages/opencode-hive
        run: |
          set +e
          for f in ./src/agents/custom-agents.test.ts ./src/agents/global-agents.test.ts ./src/agents/permissions.test.ts ./src/agents/prompts.test.ts; do
            echo "===== $f"
            bun test "$f" > /tmp/opencode-hive-agent-test.log 2>&1
            rc=$?
            echo "===== $f rc=$rc"
            ls -la /tmp/opencode-hive-agent-test.log /tmp/hive-v2-home-* 2>&1 | head -5
            find /tmp -maxdepth 1 -name 'hive-*' -newer "$GITHUB_WORKSPACE/package.json" 2>/dev/null | head -5
          done
          exit 1

      - name: Test opencode-hive (skills)
        working-directory: packages/opencode-hive
        run: bun test ./src/skills

      - name: Test opencode-hive (hooks)
        working-directory: packages/opencode-hive
        run: bun test ./src/hooks

      - name: Test opencode-hive (e2e)
        working-directory: packages/opencode-hive
        run: bun test ./src/e2e

      # The V2 harness drives plugin setup, which writes into the repo it runs
      # from (and into /tmp); keep it after the plain unit files.
      - name: Test opencode-hive (harness)
        working-directory: packages/opencode-hive
        run: bun test ./src/__tests__

      - name: Build opencode-hive
        working-directory: packages/opencode-hive
        run: bun run build
