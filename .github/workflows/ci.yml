name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Put bun on PATH
        run: echo "$(dirname "$(command -v bun)")" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install

      - name: Build hive-core
        working-directory: packages/hive-core
        run: bun run build

      - name: Reinstall to link workspace packages
        run: bun install

      - name: Test hive-core
        working-directory: packages/hive-core
        run: bun test

      # Bisect: which group turns the suite red on the runner?
      - name: G1 utils
        working-directory: packages/opencode-hive
        run: bun test ./src/utils

      - name: G1b services
        working-directory: packages/opencode-hive
        run: bun test ./src/services

      - name: G1c tools
        working-directory: packages/opencode-hive
        run: bun test ./src/tools

      - name: G1d mcp+templates
        working-directory: packages/opencode-hive
        run: bun test ./src/mcp ./src/templates

      - name: G2 hooks+skills+harness
        working-directory: packages/opencode-hive
        run: bun test ./src/hooks ./src/skills ./src/__tests__

      - name: Probe git identity
        run: |
          echo "GITHUB_ACTIONS=${GITHUB_ACTIONS:-unset}"
          echo "EMAIL=${EMAIL:-unset} GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-unset}"
          git config --list --show-origin > /tmp/gitcfg.txt 2>&1; echo "config rc=$?"
          echo "lines=$(wc -l < /tmp/gitcfg.txt)"
          git config --show-origin user.name > /tmp/gn.txt 2>&1; echo "name rc=$?"; head -2 /tmp/gn.txt
          git config --show-origin user.email > /tmp/ge.txt 2>&1; echo "email rc=$?"; head -2 /tmp/ge.txt
          git status --short > /tmp/gs.txt 2>&1; echo "status rc=$?"
          sed -i 's#^#x #' /tmp/gn.txt; echo "sed ok"

      - name: G3 e2e
        working-directory: packages/opencode-hive
        run: |
          set +e
          bun test ./src/e2e/plugin-smoke.test.ts > /tmp/e2e.log 2>&1
          echo "plugin-smoke rc=$?"
          head -40 /tmp/e2e.log
          tail -10 /tmp/e2e.log

      - name: G4 agents
        working-directory: packages/opencode-hive
        run: bun test ./src/agents
