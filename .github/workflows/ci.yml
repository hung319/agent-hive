name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Put bun on PATH
        run: echo "$(dirname "$(command -v bun)")" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install

      - name: Build hive-core
        working-directory: packages/hive-core
        run: bun run build

      - name: Reinstall to link workspace packages
        run: bun install

      - name: Test hive-core
        working-directory: packages/hive-core
        run: bun test

      - name: P5 custom-agents
        working-directory: packages/opencode-hive
        run: bun test ./src/agents/custom-agents.test.ts

      - name: P6 global-agents
        working-directory: packages/opencode-hive
        run: bun test ./src/agents/global-agents.test.ts

      - name: P7 permissions
        working-directory: packages/opencode-hive
        run: bun test ./src/agents/permissions.test.ts

      - name: P8 prompts
        working-directory: packages/opencode-hive
        run: bun test ./src/agents/prompts.test.ts
