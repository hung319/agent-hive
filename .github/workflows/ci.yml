name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Put bun on PATH
        run: echo "$(dirname "$(command -v bun)")" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install

      - name: Build hive-core
        working-directory: packages/hive-core
        run: bun run build

      - name: Reinstall to link workspace packages
        run: bun install

      - name: Test hive-core
        working-directory: packages/hive-core
        run: bun test

      # The e2e suites `git init` + `git commit`; the runner image can lack a
      # commit identity, which aborted setup before any assertion ran.
      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Utils+services+tools
        working-directory: packages/opencode-hive
        env:
          HIVE_DISABLE_AUTO_INSTALL: '1'
        run: bun test ./src/utils ./src/services ./src/tools ./src/mcp ./src/templates --timeout 30000

      - name: Hooks+skills+harness
        working-directory: packages/opencode-hive
        env:
          HIVE_DISABLE_AUTO_INSTALL: '1'
        run: bun test ./src/hooks ./src/skills ./src/__tests__ --timeout 30000

      - name: Agents
        working-directory: packages/opencode-hive
        env:
          HIVE_DISABLE_AUTO_INSTALL: '1'
        run: bun test ./src/agents --timeout 30000

      - name: E2E
        working-directory: packages/opencode-hive
        env:
          HIVE_DISABLE_AUTO_INSTALL: '1'
        run: bun test ./src/e2e --timeout 30000

      - name: Test opencode-hive (whole suite)
        working-directory: packages/opencode-hive
        env:
          HIVE_DISABLE_AUTO_INSTALL: '1'
        run: bun test --timeout 30000

      - name: Build opencode-hive
        working-directory: packages/opencode-hive
        run: bun run build
