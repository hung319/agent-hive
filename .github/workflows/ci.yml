name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Put bun on PATH
        run: echo "$(dirname "$(command -v bun)")" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install

      - name: Build hive-core
        working-directory: packages/hive-core
        run: bun run build

      - name: Reinstall to link workspace packages
        run: bun install

      - name: Test hive-core
        working-directory: packages/hive-core
        run: bun test

      # The e2e suites `git init` + `git commit` under a temp HOME; the runner
      # image has no commit identity, which aborted setup before any assertion.
      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Plugin setup no longer installs packages, so no network is needed here.
      - name: Test opencode-hive
        working-directory: packages/opencode-hive
        run: bun test --timeout 30000

      - name: Build opencode-hive
        working-directory: packages/opencode-hive
        run: bun run build
