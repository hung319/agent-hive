name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # setup-bun only puts its binary on PATH for the action's own step, while
      # `bun install`, the build scripts and `bun test` spawn `bun` themselves.
      - name: Put bun on PATH
        run: echo "$(dirname "$(command -v bun)")" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install

      - name: Build hive-core
        working-directory: packages/hive-core
        run: bun run build

      - name: Reinstall to link workspace packages
        run: bun install

      - name: Test hive-core
        working-directory: packages/hive-core
        run: bun test

      # Listed file by file (order matters: this resolution breaks when one of
      # these runs after other test files in the same process).
      - name: Test opencode-hive (agent files)
        working-directory: packages/opencode-hive
        run: |
          bun test ./src/agents/custom-agents.test.ts
          bun test ./src/agents/global-agents.test.ts
          bun test ./src/agents/permissions.test.ts
          bun test ./src/agents/prompts.test.ts

      - name: Test opencode-hive (skills)
        working-directory: packages/opencode-hive
        run: bun test ./src/skills

      - name: Test opencode-hive (hooks)
        working-directory: packages/opencode-hive
        run: bun test ./src/hooks

      - name: Test opencode-hive (harness)
        working-directory: packages/opencode-hive
        run: bun test ./src/__tests__

      - name: Test opencode-hive (e2e)
        working-directory: packages/opencode-hive
        run: bun test ./src/e2e

      - name: Build opencode-hive
        working-directory: packages/opencode-hive
        run: bun run build
