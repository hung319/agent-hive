name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Put bun on PATH
        run: echo "$(dirname "$(command -v bun)")" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install

      - name: Build hive-core
        working-directory: packages/hive-core
        run: bun run build

      - name: Reinstall to link workspace packages
        run: bun install

      - name: Test hive-core
        working-directory: packages/hive-core
        run: bun test

      - name: Probe
        working-directory: packages/opencode-hive
        run: |
          echo "pwd=$(pwd)"
          echo "bun=$(command -v bun 2>&1)"
          bun --version
          echo "bun --version rc=$?"
          ls -d node_modules 2>&1
          echo "ls rc=$?"
          ls -d ../../node_modules/@opencode 2>&1
          echo "ls2 rc=$?"
