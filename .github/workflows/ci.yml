name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Put bun on PATH
        run: echo "$(dirname "$(command -v bun)")" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install

      - name: Build hive-core
        working-directory: packages/hive-core
        run: bun run build

      - name: Reinstall to link workspace packages
        run: bun install

      - name: Test hive-core
        working-directory: packages/hive-core
        run: bun test

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Test opencode-hive
        working-directory: packages/opencode-hive
        env:
          HIVE_DISABLE_AUTO_INSTALL: '1'
        run: bun test src/e2e/custom-agent-docs-example.test.ts

      - name: T2 agent-mode
        working-directory: packages/opencode-hive
        env:
          HIVE_DISABLE_AUTO_INSTALL: '1'
        run: bun test src/e2e/agent-mode.test.ts

      - name: T3 config-autoload
        working-directory: packages/opencode-hive
        env:
          HIVE_DISABLE_AUTO_INSTALL: '1'
        run: bun test src/e2e/config-autoload-skills.test.ts

      - name: T4 plugin-smoke
        working-directory: packages/opencode-hive
        env:
          HIVE_DISABLE_AUTO_INSTALL: '1'
        run: bun test src/e2e/plugin-smoke.test.ts

      - name: T5 runtime-smoke
        working-directory: packages/opencode-hive
        env:
          HIVE_DISABLE_AUTO_INSTALL: '1'
        run: bun test src/e2e/opencode-runtime-smoke.test.ts
