name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Fixes runs of 2.0.1–2.0.3, where `bun test` failed with
      # "Cannot find module '@opencode/plugin'": setup-bun exposes the binary to
      # this action only, so `bun test` ran under a different bun than
      # `bun install` and the workspace link was not found.
      - name: Put bun on PATH for the test run
        run: echo "$(dirname "$(command -v bun)")" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install

      - name: Build hive-core
        working-directory: packages/hive-core
        run: bun run build

      - name: Reinstall to link workspace packages
        run: bun install

      - name: Test hive-core
        working-directory: packages/hive-core
        run: bun test

      - name: Test opencode-hive
        working-directory: packages/opencode-hive
        run: bun test

      - name: Build opencode-hive
        working-directory: packages/opencode-hive
        run: bun run build
