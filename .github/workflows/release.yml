name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    {}

jobs:
  release:
    runs-on: ubuntu-latest
    # BẮT BUỘC: Cấp đủ quyền cho cả việc sinh OIDC token (npm) và tạo Release (GitHub)
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # `bun install` and the build scripts spawn `bun` as a subprocess, and
      # setup-bun only puts its binary on PATH for the action's own step.
      - name: Đưa bun vào PATH
        run: echo "$(dirname "$(command -v bun)")" >> "$GITHUB_PATH"

      # npm chính chủ để publish qua OIDC (trusted publishing) ở bước cuối.
      - name: Setup Node.js (npm OIDC publish)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Cài đặt dependencies
        run: bun install

      - name: Build hive-core
        working-directory: packages/hive-core
        run: bun run build

      - name: Reinstall to link workspace packages
        run: bun install

      - name: Test hive-core
        working-directory: packages/hive-core
        run: bun test

      # Same shape as CI: the e2e suites `git init` + `git commit`, and the
      # runner image has no commit identity unless the workflow sets one.
      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Test opencode-hive
        working-directory: packages/opencode-hive
        run: bun test --timeout 30000

      - name: Build opencode-hive
        working-directory: packages/opencode-hive
        run: bun run build

      # --- TIẾN HÀNH PUBLISH LÊN NPM (Chỉ chạy khi có push tag v*) ---
      - name: Cài đặt npm mới (xác thực OIDC)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: npm install -g npm@^11

      - name: Đẩy gói lên NPM Registry
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/opencode-hive
        run: npm publish --access public --provenance

      # --- TẠO GITHUB RELEASE ---
      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
